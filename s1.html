<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0">
    <meta name="description" content="青甘大环线自驾旅游互动地图,汇集盐湖、丹霞、雅丹、莫高窟等核心景点与环线路线,支持分类筛选、行程天数切换与景点详情查看。">
    <meta name="keywords" content="青甘大环线,青海甘肃旅游,自驾游,盐湖,茶卡盐湖,翡翠湖,莫高窟,七彩丹霞,雅丹,环线路线">
    <title>青甘大环线自驾地图 | 盐湖·丹霞·莫高窟景点导航</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
          onerror="this.onerror=null;this.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';" />
    <style>
        :root {
            --bg: #f7f8fa;
            --card: #ffffff;
            --text: #2c3e50;
            --muted: #6b7785;
            --border: #e6e8ec;
            --accent: #2c7be5;
            --shadow: 0 4px 16px rgba(20, 30, 60, .08);
            --radius: 10px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                         "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
            color: var(--text);
            background: var(--bg);
            overflow: hidden;
        }
        #map { width: 100%; height: 100vh; min-height: 300px; }

        /* ====== 侧边面板 ====== */
        .panel {
            position: absolute; top: 12px; right: 12px;
            width: 320px; max-height: calc(100vh - 24px);
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            z-index: 1000;
            display: flex; flex-direction: column;
            font-size: 13px;
        }
        .panel-header {
            padding: 14px 16px 10px;
            border-bottom: 1px solid var(--border);
        }
        .panel-header h2 {
            font-size: 16px; color: var(--text);
            display: flex; align-items: center; gap: 8px;
        }
        .panel-header h2::before {
            content: ""; width: 4px; height: 16px;
            background: var(--accent); border-radius: 2px;
        }
        .panel-subtitle { color: var(--muted); font-size: 12px; margin-top: 4px; }
        .panel-body { padding: 12px 16px 16px; overflow-y: auto; flex: 1; }
        .section-title {
            font-size: 12px; font-weight: 600; color: var(--muted);
            text-transform: uppercase; letter-spacing: .5px;
            margin: 12px 0 6px;
        }
        .section-title:first-child { margin-top: 0; }

        /* ====== 搜索 ====== */
        .search-box {
            position: relative; margin-bottom: 4px;
        }
        .search-box input {
            width: 100%; padding: 9px 12px 9px 34px;
            border: 1px solid var(--border); border-radius: 8px;
            background: #fafbfc; font-size: 13px;
            transition: all .2s;
        }
        .search-box input:focus {
            outline: none; border-color: var(--accent); background: #fff;
            box-shadow: 0 0 0 3px rgba(44,123,229,.1);
        }
        .search-box::before {
            content: "🔍"; position: absolute; left: 11px; top: 50%;
            transform: translateY(-50%); font-size: 13px; opacity: .55;
        }
        .search-clear {
            position: absolute; right: 8px; top: 50%;
            transform: translateY(-50%);
            background: none; border: none; cursor: pointer;
            color: var(--muted); font-size: 16px; display: none;
            padding: 4px; line-height: 1;
        }
        .search-clear.visible { display: block; }

        /* ====== 行程切换 ====== */
        .seg {
            display: flex; background: #f0f2f5; padding: 3px;
            border-radius: 8px; gap: 2px;
        }
        .seg button {
            flex: 1; padding: 7px 0; border: none; background: transparent;
            font-size: 12px; color: var(--muted); cursor: pointer;
            border-radius: 6px; transition: all .2s; font-weight: 500;
        }
        .seg button.active {
            background: #fff; color: var(--text);
            box-shadow: 0 1px 3px rgba(0,0,0,.08); font-weight: 600;
        }
        .seg button:not(.active):hover { color: var(--text); }

        /* ====== 筛选 ====== */
        .filters { display: flex; flex-direction: column; gap: 2px; }
        .filter-item {
            display: flex; align-items: center; padding: 6px 8px;
            cursor: pointer; border-radius: 6px;
            transition: background .15s; user-select: none;
        }
        .filter-item:hover { background: #f5f7fa; }
        .filter-item input { display: none; }
        .filter-item .check {
            width: 16px; height: 16px; border: 2px solid #c8ccd2;
            border-radius: 4px; margin-right: 10px;
            display: flex; align-items: center; justify-content: center;
            transition: all .15s; flex-shrink: 0;
        }
        .filter-item input:checked + .check {
            background: var(--accent); border-color: var(--accent);
        }
        .filter-item input:checked + .check::after {
            content: "✓"; color: #fff; font-size: 11px; font-weight: bold;
        }
        .legend-dot {
            width: 10px; height: 10px; border-radius: 50%;
            margin-right: 8px; flex-shrink: 0;
        }
        .filter-item span { flex: 1; }
        .filter-count {
            color: var(--muted); font-size: 11px;
            background: #f0f2f5; padding: 1px 6px; border-radius: 8px;
        }

        /* ====== 每日行程列表 ====== */
        .day-list { display: flex; flex-direction: column; gap: 6px; }
        .day-item {
            padding: 9px 11px; border-radius: 8px;
            background: #fafbfc; border: 1px solid var(--border);
            cursor: pointer; transition: all .15s;
            display: flex; align-items: center; gap: 10px;
        }
        .day-item:hover { border-color: var(--accent); background: #fff; }
        .day-item.active {
            border-color: var(--accent); background: #eaf2fe;
            box-shadow: 0 0 0 2px rgba(44,123,229,.1);
        }
        .day-badge {
            width: 28px; height: 28px; border-radius: 50%;
            background: var(--accent); color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 600; flex-shrink: 0;
        }
        .day-info { flex: 1; min-width: 0; }
        .day-name {
            font-size: 13px; font-weight: 600;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .day-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }

        /* ====== 移动端折叠按钮 ====== */
        .panel-toggle {
            display: none;
            position: fixed; top: 12px; right: 12px;
            z-index: 1200; background: var(--card);
            border: none; border-radius: 50%;
            width: 44px; height: 44px;
            box-shadow: var(--shadow); cursor: pointer;
            font-size: 20px; color: var(--text);
            align-items: center; justify-content: center;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .panel-close {
            display: none;
            position: absolute; top: 10px; right: 10px;
            z-index: 1001; background: transparent;
            border: none; font-size: 22px; cursor: pointer;
            color: var(--muted); padding: 6px 10px;
            -webkit-tap-highlight-color: transparent;
            line-height: 1;
        }

        /* ====== 图例标记 ====== */
        .marker-label {
            background: rgba(255,255,255,.95);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px; font-weight: 600;
            color: var(--text);
            border: 1px solid rgba(0,0,0,.1);
            box-shadow: 0 1px 4px rgba(0,0,0,.15);
            white-space: nowrap;
        }
        .marker-label::before {
            content: ""; display: inline-block;
            width: 6px; height: 6px; border-radius: 50%;
            background: currentColor; margin-right: 5px; vertical-align: middle;
        }

        /* ====== 弹窗 ====== */
        .leaflet-popup-content-wrapper {
            border-radius: 10px; padding: 0;
            box-shadow: 0 6px 24px rgba(0,0,0,.15);
        }
        .leaflet-popup-content { margin: 0; width: 260px !important; }
        .popup-img {
            width: 100%; height: 130px; object-fit: cover;
            display: block; background: #eef0f3;
        }
        .popup-body { padding: 12px 14px 14px; }
        .popup-title {
            font-weight: 700; font-size: 15px; color: var(--text);
            margin-bottom: 6px;
            display: flex; align-items: center; gap: 6px;
        }
        .popup-cat {
            font-size: 10px; padding: 2px 7px; border-radius: 10px;
            color: #fff; font-weight: 500;
        }
        .popup-desc { font-size: 12.5px; color: #555; line-height: 1.6; margin-bottom: 10px; }
        .popup-meta {
            display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px;
            padding-top: 10px; border-top: 1px solid var(--border);
            font-size: 11.5px;
        }
        .popup-meta-row {
            display: flex; align-items: center; gap: 5px;
            color: var(--muted);
        }
        .popup-meta-row .ico { font-size: 12px; }
        .popup-meta-row .val { color: var(--text); font-weight: 500; }
        .popup-actions {
            display: flex; gap: 6px; margin-top: 12px;
        }
        .popup-btn {
            flex: 1; padding: 6px 0; border: 1px solid var(--border);
            background: #fff; border-radius: 6px;
            font-size: 11.5px; color: var(--text);
            cursor: pointer; text-align: center;
            transition: all .15s; text-decoration: none;
        }
        .popup-btn:hover { border-color: var(--accent); color: var(--accent); }
        .popup-btn.primary {
            background: var(--accent); color: #fff; border-color: var(--accent);
        }
        .popup-btn.primary:hover { background: #1f6ad4; color: #fff; }

        /* ====== 行程统计卡片 ====== */
        .stats-bar {
            position: absolute; left: 12px; top: 12px;
            background: var(--card); padding: 10px 14px;
            border-radius: var(--radius); box-shadow: var(--shadow);
            z-index: 1000; font-size: 12px;
            display: flex; gap: 18px;
        }
        .stat { display: flex; flex-direction: column; align-items: center; }
        .stat-val { font-size: 16px; font-weight: 700; color: var(--accent); }
        .stat-label { color: var(--muted); font-size: 11px; margin-top: 1px; }

        /* ====== 响应式 ====== */
        @media (max-width: 768px) {
            .stats-bar { padding: 8px 12px; gap: 12px; font-size: 11px; }
            .stat-val { font-size: 14px; }
            .panel {
                position: fixed; top: 0; right: -100%;
                width: 86%; max-width: 340px; height: 100vh;
                max-height: 100vh; border-radius: 0;
                transition: right .25s ease-out;
                box-shadow: -4px 0 20px rgba(0,0,0,.15);
            }
            .panel.open { right: 0; }
            .panel-toggle { display: flex; }
            body.panel-open .panel-toggle { display: none; }
            .panel-close { display: block; }
            .leaflet-popup-content { width: 220px !important; }
            /* 抽屉打开时的遮罩 */
            .panel-backdrop {
                position: fixed; inset: 0; background: rgba(0,0,0,.35);
                z-index: 999; opacity: 0; pointer-events: none;
                transition: opacity .25s;
            }
            .panel-backdrop.show { opacity: 1; pointer-events: auto; }
        }

        /* ====== 滚动条 ====== */
        .panel-body::-webkit-scrollbar { width: 5px; }
        .panel-body::-webkit-scrollbar-thumb { background: #d0d4da; border-radius: 3px; }
        .panel-body::-webkit-scrollbar-track { background: transparent; }

        /* ====== 空状态 ====== */
        .empty {
            text-align: center; padding: 20px 10px;
            color: var(--muted); font-size: 12px;
        }
        .empty-icon { font-size: 28px; margin-bottom: 6px; opacity: .5; }

        /* ====== 加载 ====== */
        .leaflet-control-attribution {
            font-size: 10px !important; background: rgba(255,255,255,.7) !important;
        }
    </style>
</head>
<body>

        <div class="stat"><div class="stat-val" id="statLakes">0</div><div class="stat-label">盐湖</div></div>

    /* ========== 工具:距离 ========== */
    function haversine(a, b) {
        const R = 6371;
        const toRad = d => d * Math.PI / 180;
        const dLat = toRad(b.lat - a.lat);
        const dLng = toRad(b.lng - a.lng);
        const x = Math.sin(dLat/2)**2 +
                  Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) *
                  Math.sin(dLng/2)**2;
        return 2 * R * Math.asin(Math.sqrt(x));
    }

        const dayLabel = dayInfo ? `${dayInfo.day} · ${dayInfo.label}` : '';

            ${item.img ? `<img src="${item.img}" class="popup-img" loading="lazy" onerror="this.style.display='none'">` : ''}

                <div class="popup-title">

                <div class="popup-actions">
                    <a class="popup-btn primary" target="_blank"
                      href="https://uri.amap.com/marker?position=${item.lng},${item.lat}&name=${encodeURIComponent(item.name)}&src=mapp">高德地图</a>

                      href="https://www.google.com/maps?q=${item.lat},${item.lng}">Google Maps</a>
                </div>
            </div>`;
        return L.marker([item.lat, item.lng], { icon, title: item.name })

    function clearRoutes() { routeLayer.clearLayers(); currentDayLayer = null; }

    function drawDayRoutes(days, highlightIdx = -1) {
        clearRoutes();
        days.forEach((day, idx) => {
            const coords = day.points.map(p => [p.lat, p.lng]);
            const color = routeColorPalette[idx % routeColorPalette.length];
            const poly = L.polyline(coords, {
                color, weight: highlightIdx === -1 ? 4 : (idx === highlightIdx ? 7 : 3),
                opacity: highlightIdx === -1 ? 0.75 : (idx === highlightIdx ? 0.95 : 0.35),
                dashArray: '8, 6'
            }).addTo(routeLayer);
            poly.bindTooltip(`${day.name} · ${day.km}km`, { sticky: true });
            if (idx === highlightIdx) currentDayLayer = poly;
        });
    }

    /* ========== 行程数据索引 ========== */
    function buildDayIndex(days) {
        dayIndexMap.length = 0;
        Object.keys(dayIndexMap).forEach(k => delete dayIndexMap[k]);
        days.forEach((day, i) => {
            const firstPt = day.points[0];
            const lastPt = day.points[day.points.length - 1];
            const label = `${firstPt.name} → ${lastPt.name}`;
            day.points.forEach(p => {
                dayIndexMap[p.name] = { day: day.name, label };
            });
        });
        // 重建 dayIndexMap
        days.forEach((day, i) => {
            const firstPt = day.points[0];
            const lastPt = day.points[day.points.length - 1];
            const label = `${firstPt.name} → ${lastPt.name}`;
            day.points.forEach(p => {
                dayIndexMap[p.name] = { day: day.name, label };
            });
        });
    }

        document.getElementById('statSpots').textContent = saltLakes.length + scenics.length;
        document.getElementById('statLakes').textContent = saltLakes.length;
    }

        currentDays = days;

        buildDayIndex(route);

        updateStats(route);
        renderDayList(route, dayIdx);

        allMarkers.forEach(m => m.closePopup());

    function renderDayList(days, activeIdx) {

        const allItem = document.createElement('div');
        allItem.className = 'day-item' + (activeIdx === -1 ? ' active' : '');
        allItem.innerHTML = `

                <div class="day-meta">${days.reduce((s,d)=>s+d.km,0)} km · ${days.length} 天</div>

        allItem.addEventListener('click', () => {
            applyDays(currentDays, -1);
            map.flyToBounds(L.featureGroup(days.flatMap(d => d.points.map(p => L.marker([p.lat, p.lng])))).getBounds(), { padding: [40, 40] });
        });
        list.appendChild(allItem);

        days.forEach((d, i) => {
            const div = document.createElement('div');
            div.className = 'day-item' + (activeIdx === i ? ' active' : '');
            div.style.borderLeftColor = routeColorPalette[i % routeColorPalette.length];

            div.innerHTML = `
                <div class="day-badge" style="background:${routeColorPalette[i % routeColorPalette.length]};">${i+1}</div>
                <div class="day-info">
                    <div class="day-name">${d.name}</div>
                    <div class="day-meta">${d.km} km · ${d.points.length} 站</div>
                </div>`;
            div.addEventListener('click', () => {
                applyDays(currentDays, i);
                const bounds = L.latLngBounds(d.points.map(p => [p.lat, p.lng]));
                map.flyToBounds(bounds, { padding: [60, 60] });
            });
            list.appendChild(div);
        });
    }

    /* ========== 行程天数段控件 ========== */
    document.querySelectorAll('#daySeg button').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('#daySeg button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            applyDays(parseInt(btn.dataset.days), -1);
        });
    });

    /* ========== 分类筛选 ========== */
    const filterContainer = document.getElementById('filters');
    Object.entries(categories).forEach(([key, cat]) => {
        const div = document.createElement('div');
        div.className = 'filter-item';
        div.innerHTML = `
            <input type="checkbox" id="filter-${key}" checked>
            <div class="check"></div>
            <div class="legend-dot" style="background:${cat.color};"></div>
            <span>${cat.name}</span>
            <span class="filter-count">${key === 'salt_lake' ? saltLakes.length : key === 'city' ? cities.length : key === 'scenic' ? scenics.length : ''}</span>`;
        div.querySelector('input').addEventListener('change', e => {
            if (e.target.checked) map.addLayer(layers[key]);
            else map.removeLayer(layers[key]);
        });
        div.addEventListener('click', e => {
            if (e.target.tagName !== 'INPUT') {
                const cb = div.querySelector('input');
                cb.checked = !cb.checked;
                cb.dispatchEvent(new Event('change'));
            }
        });
        filterContainer.appendChild(div);
    });

    /* ========== 搜索 ========== */
    const searchInput = document.getElementById('searchInput');
    const searchClear = document.getElementById('searchClear');

    function performSearch(q) {
        q = q.trim().toLowerCase();
        searchClear.classList.toggle('visible', q.length > 0);
        if (!q) {
            allMarkers.forEach(m => m.setOpacity(1));
            return;
        }
        allMarkers.forEach(m => {
            const hit = m._data.name.toLowerCase().includes(q) ||
                        (m._data.desc && m._data.desc.toLowerCase().includes(q));
            m.setOpacity(hit ? 1 : 0.15);
        });
    }
    searchInput.addEventListener('input', e => performSearch(e.target.value));
    searchClear.addEventListener('click', () => {
        searchInput.value = '';
        performSearch('');
        searchInput.focus();
    });

    /* ========== 移动端面板 ========== */
    const panel = document.getElementById('panel');
    const panelToggle = document.getElementById('panelToggle');
    const panelClose = document.getElementById('panelClose');
    const panelBackdrop = document.getElementById('panelBackdrop');

    function isMobile() { return window.matchMedia('(max-width: 768px)').matches; }
    function openPanel() {
        panel.classList.add('open');
        if (isMobile()) {
            panelBackdrop.classList.add('show');
            document.body.classList.add('panel-open');
        }
        setTimeout(() => map.invalidateSize(), 280);
    }
    function closePanel() {
        panel.classList.remove('open');
        panelBackdrop.classList.remove('show');
        document.body.classList.remove('panel-open');
        setTimeout(() => map.invalidateSize(), 280);
    }
    function togglePanel() {
        if (panel.classList.contains('open')) closePanel();
        else openPanel();
    }

    panelToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        e.preventDefault();
        togglePanel();
    });
    panelClose.addEventListener('click', closePanel);
    panelBackdrop.addEventListener('click', closePanel);
    // Esc 关闭
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && panel.classList.contains('open')) closePanel();
    });

    /* ========== 初始 ========== */
    applyDays(7, -1);

    // 适应屏幕:多次重算,解决移动端首次渲染白屏
    function refreshMap() { map.invalidateSize(); }
    setTimeout(refreshMap, 50);
    setTimeout(refreshMap, 300);
    setTimeout(refreshMap, 800);
    window.addEventListener('resize', refreshMap);
    window.addEventListener('orientationchange', () => setTimeout(refreshMap, 200));
    </script>
</body>
</html>
